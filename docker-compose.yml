services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-include *.py
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET=diagno-pilot-files
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-diagno_redis_dev}@redis:6379/0
      - AGENT_EPIDEMIOLOGY_URL=http://agent-epidemiology:8001
      - AGENT_SYMPTOMATOLOGY_URL=http://agent-symptomatology:8002
      - AGENT_LAB_URL=http://agent-lab:8003
      - AGENT_TREATMENT_URL=http://agent-treatment:8004
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_RETRY_MAX=${LLM_RETRY_MAX:-1}
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      redis:
        condition: service_healthy
      agent-epidemiology:
        condition: service_healthy
      agent-symptomatology:
        condition: service_healthy
      agent-lab:
        condition: service_healthy
      agent-treatment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-epidemiology:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.epidemiology_server
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_RETRY_MAX=${LLM_RETRY_MAX:-1}
      - SERVER_PORT=8001
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-symptomatology:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.symptomatology_server
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_RETRY_MAX=${LLM_RETRY_MAX:-1}
      - SERVER_PORT=8002
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-lab:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.lab_server
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_RETRY_MAX=${LLM_RETRY_MAX:-1}
      - SERVER_PORT=8003
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-treatment:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.treatment_server
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_RETRY_MAX=${LLM_RETRY_MAX:-1}
      - SERVER_PORT=8004
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seed:
    build: ./backend
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-diagno_dev}:${MONGO_PASSWORD:-diagno_dev_pass}@mongo:27017/diagno_pilot?authSource=admin
    volumes:
      - ./backend:/workspace/backend
      - ./scripts:/workspace/scripts
    command: python /workspace/scripts/seed.py
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-diagno_redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD:-diagno_redis_dev} redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ⚠️ MongoDB authentication: existing dev environments must remove the mongo volume
  # before the first start with auth, because MONGODB_INITDB_ROOT_USERNAME is only
  # executed on a fresh volume:
  #   docker compose down -v
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INIT_REPLICA_SET=true
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-diagno_dev}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-diagno_dev_pass}
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval 'try{rs.status().ok}catch(e){0}' --quiet"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # In production, disable anonymous access: GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  model:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./model:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/MedicalQwen3-Reasoning-4B.Q8_0.gguf
      - LLAMA_ARG_CTX_SIZE=${MODEL_CONTEXT_SIZE:-4096}
      - LLAMA_ARG_N_GPU_LAYERS=0
      - LLAMA_ARG_N_PREDICT=${MODEL_MAX_TOKENS:-2048}
      - LLAMA_ARG_REASONING_BUDGET=0
      - LLAMA_ARG_THREADS=${MODEL_THREADS:-4}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongo_data:
  mongo_configdb:
  localstack_data:
  redis_data:
  loki_data:
  promtail_positions:
  grafana_data:
  prometheus_data:
