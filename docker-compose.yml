services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET=diagno-pilot-files
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - MODEL_CONTAINER_URL=http://model:8080/v1
      - REDIS_URL=redis://redis:6379/0
      - AGENT_EPIDEMIOLOGY_URL=http://agent-epidemiology:8001
      - AGENT_SYMPTOMATOLOGY_URL=http://agent-symptomatology:8002
      - AGENT_LAB_URL=http://agent-lab:8003
      - AGENT_TREATMENT_URL=http://agent-treatment:8004
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      redis:
        condition: service_healthy
      agent-epidemiology:
        condition: service_healthy
      agent-symptomatology:
        condition: service_healthy
      agent-lab:
        condition: service_healthy
      agent-treatment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-epidemiology:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.epidemiology_server
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - SERVER_PORT=8001
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-symptomatology:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.symptomatology_server
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - SERVER_PORT=8002
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-lab:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.lab_server
    ports:
      - "8003:8003"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - SERVER_PORT=8003
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-treatment:
    build:
      context: ./backend
      dockerfile: agents/mcp_servers/Dockerfile
    command: python -m backend.agents.mcp_servers.treatment_server
    ports:
      - "8004:8004"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
      - LLM_PRIMARY_URL=${LLM_PRIMARY_URL}
      - LLM_PRIMARY_API_KEY=${LLM_PRIMARY_API_KEY}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - SERVER_PORT=8004
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seed:
    build: ./backend
    environment:
      - MONGODB_URI=mongodb://mongo:27017/diagno_pilot
    volumes:
      - ./backend:/workspace/backend
      - ./scripts:/workspace/scripts
    command: python /workspace/scripts/seed.py
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INIT_REPLICA_SET=true
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "try{rs.status().ok}catch(e){0}", "--quiet"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  model:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./model:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/MedicalQwen3-Reasoning-4B.Q8_0.gguf
      - LLAMA_ARG_CTX_SIZE=${MODEL_CONTEXT_SIZE:-4096}
      - LLAMA_ARG_N_GPU_LAYERS=${MODEL_GPU_LAYERS:-99}
      - LLAMA_ARG_THREADS=${MODEL_THREADS:-4}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  model-cpu:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./model:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/MedicalQwen3-Reasoning-4B.Q8_0.gguf
      - LLAMA_ARG_CTX_SIZE=${MODEL_CONTEXT_SIZE:-4096}
      - LLAMA_ARG_N_GPU_LAYERS=0
      - LLAMA_ARG_THREADS=${MODEL_THREADS:-4}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    profiles:
      - cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongo_data:
  mongo_configdb:
  localstack_data:
  redis_data:
  web_node_modules:
  web_next_cache:
  loki_data:
  promtail_positions:
  grafana_data:
  prometheus_data:
