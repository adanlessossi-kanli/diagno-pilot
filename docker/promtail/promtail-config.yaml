server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      max_period: 5m
    # ~10 MB buffer
    batchsize: 1048576
    batchwait: 1s

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - json:
          source: log
          expressions:
            level: level
            method: method
            status_code: status_code
            request_id: request_id
            path: path
            duration_ms: duration_ms
            message: message
      # Low-cardinality fields → Loki labels
      - labels:
          level:
          method:
          status_code:
      # High-cardinality fields → structured metadata (not labels)
      - structured_metadata:
          request_id:
          path:
          duration_ms:
          message:
      - limit:
          rate: 10000
          burst: 10000
          drop: false
          max_line_size: 65536
